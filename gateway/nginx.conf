events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8088;
        server_tokens off;
        client_max_body_size 2m;

        root /usr/share/nginx/html;
        index index.html;

        # Hardened Security Headers (Inherited or explicitly set)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Block internal APIs completely
        location ^~ /ms/v1/contents/quizzes/internal/ {
            return 404;
        }

        location ^~ /api/v1/memberships/internal/ {
            return 404;
        }

        # Identity Service API
        location /ms/v1/identity/ {
            set $backend "http://identity-service:8084";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Content Service API
        location /ms/v1/contents/ {
            set $backend "http://content-service:8085";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Assessment Service API
        location /ms/v1/attempts {
            set $backend "http://assessment-service:8086";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Membership Service API
        location /api/v1/memberships/ {
            set $backend "http://membership-service:8082";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Interaction Service API
        location /api/v1/interactions/ {
            set $backend "http://interaction-service:8083";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Catch-all for undefined /api/ or /ms/ routes: return JSON 404 instead of SPA HTML
        location ^~ /ms/ {
            default_type application/json;
            return 404 '{"error":"Endpoint not found","status":404}';
        }

        location ^~ /api/ {
            default_type application/json;
            return 404 '{"error":"Endpoint not found","status":404}';
        }

        # Static assets with immutable content hashes: cache for 1 year, return 404 if missing (do not fall back to index.html)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # Revalidatable HTML Entrypoint (SPA fallback)
        location / {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
