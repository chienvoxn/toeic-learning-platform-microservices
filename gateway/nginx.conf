events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8088;
        server_tokens off;
        client_max_body_size 2m;

        root /usr/share/nginx/html;
        index index.html;

        # Block internal APIs
        location ^~ /ms/v1/contents/quizzes/internal/ {
            return 404;
        }

        location ^~ /api/v1/memberships/internal/ {
            return 404;
        }

        # Identity Service
        location /ms/v1/identity/ {
            set $backend "http://identity-service:8084";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Content Service
        location /ms/v1/contents/ {
            set $backend "http://content-service:8085";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Assessment Service
        location /ms/v1/attempts {
            set $backend "http://assessment-service:8086";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Membership Service
        location /api/v1/memberships/ {
            set $backend "http://membership-service:8082";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Interaction Service
        location /api/v1/interactions/ {
            set $backend "http://interaction-service:8083";
            proxy_pass $backend;
            include /etc/nginx/proxy_params;
        }

        # Static frontend
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
